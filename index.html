<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>Limerick Map</title>

    <link rel="stylesheet"
          href="index.css">

    <link relkg.com/leaflet@1.9.4/dist/leaflet.css" />
</headc="https://unpkg.com/leaflet@1.9.4.jsscript>

<script>

const map = L.map('map').setView(
    [52.6638,-8.6267],
    13
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([52.6638,-8.6267])
 .addTo(map)
 .bindPopup('Limerick');

</script>

</body>

</html>
