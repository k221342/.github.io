<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WUCC 2026</title>

    <link rel="stylesheet"
          href="index.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="hero">
        <div class="logo-wrap">
            <img src="images/wucc2026-logo.png"
                alt="WUCC 2026 logo"
                class="logo">
        </div>
        
        <div class="countdown">

            <div class="countdown-label">
                EVENT STARTS IN
            </div>

            <div id="countdown"
                 class="countdown-time">
                --d --h --m
            </div>

        </div>

        <div class="button-group">

            <a href="map.html"
               class="menu-card">

                <span class="menu-icon">
                    🗺️
                </span>

                <div class="menu-content">

                    <div class="menu-title">
                        MAP
                    </div>

                    <div class="menu-desc">
                        地図を見る
                    </div>

                </div>

                <span class="menu-arrow">
                    ›
                </span>

            </a>

            <a href="packing.html"
               class="menu-card">

                <span class="menu-icon">
                    🎒
                </span>

                <div class="menu-content">

                    <div class="menu-title">
                        PACKING
                    </div>

                    <div class="menu-desc">
                        持ち物リスト
                    </div>

                </div>

                <span class="menu-arrow">
                    ›
                </span>

            </a>

            <a href="weather.html"
               class="menu-card">

                <span class="menu-icon">
                    🌦️
                </span>

                <div class="menu-content">

                    <div class="menu-title">
                        WEATHER
                    </div>

                    <div class="menu-desc">
                        リムリックの天気
                    </div>

                </div>

                <span class="menu-arrow">
                    ›
                </span>

            </a>

            <a href="https://results.wfdf.sport/wucc-2026/team/mixed/jandlux-1093"
                class="menu-card"
                target="_blank"
                rel="noopener noreferrer">
                <span class="menu-icon">🏆</span>
                <div class="menu-content">
                    <div class="menu-title">
                        Tournament Info
                    </div>
                    <div class="menu-desc">
                        JANDLUX チームリザルト
                    </div>
                </div>
                <span class="menu-arrow">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </span>
            </a>

        </div>

        <div class="footer-info">
            LIMERICK, IRELAND<br>
            AUGUST 2026
        </div>

    </main>

    <script>

        const eventDate =
            new Date(
                "2026-08-15T12:50:00+01:00"
            );

        function updateCountdown() {

            const now =
                new Date();

            const diff =
                eventDate - now;

            if (diff <= 0) {

                document
                    .getElementById(
                        "countdown"
                    )
                    .textContent =
                    "LIVE";

                return;
            }

            const days =
                Math.floor(
                    diff /
                    (1000 * 60 * 60 * 24)
                );

            const hours =
                Math.floor(
                    diff /
                    (1000 * 60 * 60)
                ) % 24;

            const minutes =
                Math.floor(
                    diff /
                    (1000 * 60)
                ) % 60;

            document
                .getElementById(
                    "countdown"
                )
                .textContent =
                `${days}d ${hours}h ${minutes}m`;
        }

        updateCountdown();

        setInterval(
            updateCountdown,
            60000
        );

    </script>

</body>

</html>
