<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limerick Living Map</title>

    <!-- 自分のCSS -->
    <link rel="stylesheet" href="index.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>

<body>

    <!-- 地図表示エリア。必ずbodyの中に置く -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // CSS変数からアイコンサイズを取得
        const rootStyle = getComputedStyle(document.documentElement);
        const iconSize = parseInt(rootStyle.getPropertyValue('--marker-size'));

        // 地図をThomond Student Village中心に表示
        const map = L.map('map').setView(
            [52.682556, -8.659160],
            15
        );

        // OpenStreetMapの地図タイル
        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // Font Awesomeアイコンを作る関数
        function createIcon(iconClass, cssClass) {
            return L.divIcon({
                html: `<i class="${iconClass}"></i>`,
                className: cssClass,
                iconSize: [iconSize, iconSize],
                iconAnchor: [iconSize / 2, iconSize],
                popupAnchor: [0, -iconSize]
            });
        }

        // アイコン定義
        const homeIcon = createIcon(
            'fa-solid fa-house',
            'map-icon home-icon'
        );

        const supermarketIcon = createIcon(
            'fa-solid fa-cart-shopping',
            'map-icon supermarket-icon'
        );

        const shoppingcentreIcon = createIcon(
            'fa-solid fa-city',
            'map-icon shoppingcentre-icon'
        );

        const convenienceIcon = createIcon(
            'fa-solid fa-store',
            'map-icon convenience-icon'
        );

        const pharmacyIcon = createIcon(
            'fa-solid fa-capsules',
            'map-icon pharmacy-icon'
        );
        
        const cafeIcon = createIcon(
            'fa-solid fa-mug-hot',
            'map-icon cafe-icon'
        );

        const restaurantIcon = createIcon(
            'fa-solid fa-utensils',
            'map-icon restaurant-icon'
        );

        const pubIcon = createIcon(
            'fa-solid fa-beer-mug-empty',
            'map-icon pub-icon'
        );
        
        const parkIcon = createIcon(
            'fa-solid fa-tree',
            'map-icon park-icon'
        );

        // Thomond Student Village
        L.marker(
            [52.682556, -8.659160],
            { icon: homeIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>拠点</b><br>
            Thomond student villge
        `);

        // スーパーマーケット
        L.marker(
            [52.67520468753453, -8.674791113960339],
            { icon: supermarketIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Tesco</b><br>
            スーパーマーケット<br>
            8:00 - 22:00<br>
            <i class="fa-solid fa-car"></i> 車 5分
        `);

        L.marker(
            [52.6784841962892, -8.637864137222943],
            { icon: supermarketIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Tesco</b><br>
            スーパーマーケット<br>
            日曜以外 8:00 - 22:00<br>
            日曜　　 9:00 - 21:00<br>
            <i class="fa-solid fa-car"></i> 車 6分
        `);
        
        L.marker(
            [52.67233805458714, -8.66274298322991],
            { icon: supermarketIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>MACE</b><br>
            スーパーマーケット<br>
            8:00 - 22:00<br>
            <i class="fa-solid fa-car"></i> 車 5分
        `);
        
        L.marker(
            [52.67124765496133, -8.659432302888716],
            { icon: supermarketIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Lidl</b><br>
            スーパーマーケット<br>
            日曜以外 8:00 - 22:00<br>
            日曜　　 9:00 - 21:00<br>
            <i class="fa-solid fa-car"></i> 車 7分
        `);

        L.marker(
            [52.67124765496133, -8.659432302888716],
            { icon: shoppingcentreIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Jetland Shopping Centre</b><br>
            ショッピングモール<br>
            日曜以外 8:00 - 22:00<br>
            日曜　　 9:00 - 21:00<br>
            <i class="fa-solid fa-car"></i> 車 6分
        `);

         L.marker(
            [52.67941247530736, -8.660868938198616],
            { icon: convenienceIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Spar</b><br>
            コンビニ<br>
            平日 7:00 - 22:00<br>
            休日 8:00 - 22:00<br>
            <i class="fa-solid fa-car"></i> 車 2分<br>
            <i class="fa-solid fa-person-walking"></i>徒歩 7分
        `);

        L.marker(
            [52.67571407629599, -8.652119310319476],
            { icon: convenienceIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Centre Woodview</b><br>
            コンビニ<br>
            平日 7:00 - 21:00<br>
            土曜 8:00 - 21:00<br>
            日曜 9:00 - 21:00<br>
            <i class="fa-solid fa-car"></i> 車 3分
        `);

        L.marker(
            [52.6757773535446, -8.652230096706036],
            { icon: pharmacyIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Woodview Pharmacy</b><br>
            ドラッグストア<br>
            平日  9:00 - 18:00<br>
            土曜 10:00 - 17:00<br>
            日休<br>
            <i class="fa-solid fa-car"></i> 車 3分
        `);

        L.marker(
            [52.67890336357734, -8.637972289621006],
            { icon: pharmacyIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>People's Pharmacy</b><br>
            ドラッグストア<br>
            平日  9:30 - 18:00<br>
            土曜 10:00 - 16:00<br>
            日休<br>
            <i class="fa-solid fa-car"></i> 車 7分
        `);
        
        L.marker(
            [52.6798, -8.6572],
            { icon: cafeIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Cafe Sample</b><br>
            カフェ候補
        `);

        L.marker(
            [52.6840, -8.6620],
            { icon: restaurantIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Restaurant Sample</b><br>
            レストラン候補
        `);

        L.marker(
            [52.6860, -8.6600],
            { icon: pubIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Pub Sample</b><br>
            パブ候補
        `);

        L.marker(
            [52.676616, -8.665151],
            { icon: parkIcon }
        )
        .addTo(map)
        .bindPopup(`
            <b>Caherdavin Park</b><br>
            公園<br>
            一般利用可能 by Gemini<br>
            <i class="fa-solid fa-car"></i> 車 3分<br>
            <i class="fa-solid fa-person-walking"></i>徒歩 14分
        `);
    </script>

</body>

</html>
