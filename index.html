<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Limerick Living Map</title>

    index.css

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet      <h1>🇮🇪 Limerick Living Map</h1>
        <p>生活拠点・スーパー・カフェ・観光地</p>

        <div class="filter-panel">
            <button onclick="showCategory('all')">すべて</button>
            <button onclick="showCategory('supermarket')">スーパー</button>
            <button onclick="showCategory('cafe')">カフェ</button>
            <button onclick="showCategory('restaurant')">レストラン</button>
            <button onclick="showCategory('pub')">パブ</button>
        </div>
    </header>

    <div id="map"></div>

    <script srckg.com/leaflet@1.9.4/dist/leaflet.jsscript>

    <script>

        // リムリック中心
        const map = L.map('map').setView([52.6638, -8.6267], 14);

        // OpenStreetMap
        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        const markers = [];

        function addMarker(lat, lon, category, popupHtml) {

            const marker = L.marker([lat, lon])
                .addTo(map)
                .bindPopup(popupHtml);

            marker.category = category;

            markers.push(marker);
        }

        // ===== 拠点 =====

        addMarker(
            52.6638,
            -8.6267,
            'base',
            `
            <h3>生活拠点</h3>
            <p>滞在先</p>
            `
        );

        // ===== スーパー =====

        addMarker(
            52.6618,
            -8.6310,
            'supermarket',
            `
            <h3>Tesco</h3>
            <p>大型スーパー</p>
            `
        );

        addMarker(
            52.6673,
            -8.6212,
            'supermarket',
            `
            <h3>Dunnes Stores</h3>
            <p>食品・日用品</p>
            `
        );

        // ===== カフェ =====

        addMarker(
            52.6660,
            -8.6245,
            'cafe',
            `
            <h3>お気に入りカフェ</h3>
            <p>コーヒーがおすすめ</p>
            `
        );

        // ===== レストラン =====

        addMarker(
            52.6645,
            -8.6195,
            'restaurant',
            `
            <h3>レストラン</h3>
            <p>夕食向き</p>
            `
        );

        // ===== パブ =====

        addMarker(
            52.6650,
            -8.6295,
            'pub',
            `
            <h3>Irish Pub</h3>
            <p>ギネスが人気</p>
            `
        );

        // ===== フィルタ =====

        function showCategory(category) {

            markers.forEach(marker => {

                if (category === 'all') {

                    if (!map.hasLayer(marker)) {
                        marker.addTo(map);
                    }

                } else {

                    if (marker.category === category) {

                        if (!map.hasLayer(marker)) {
                            marker.addTo(map);
                        }

                    } else {

                        if (map.hasLayer(marker)) {
                            map.removeLayer(marker);
                        }

                    }
                }
            });
        }

    </script>

</body>

</html>
