<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUCC 2026 Packing List</title>

    <link rel="stylesheet" href="packing.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>🇮🇪 WUCC 2026 Packing List</h1>

            <div id="progressText">
                0 / 0 完了
            </div>

            <div class="progress-bar">
                <div id="progressFill"
                    class="progress-fill">
                </div>
            </div>

        </div>

        <div id="listContainer"
            class="sections">
        </div>

        <a href="index.html"
            class="home-link">
            ← Homeへ戻る
        </a>

    </div>

<script>

const STORAGE_KEY = "packingData";

let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
);

if(!data){

    data = [

        {
            category:"🛂 必須アイテム",

            items:[
                {
                    text:"パスポート",
                    checked:false
                },

                {
                    text:"財布",
                    checked:false
                },

                {
                    text:"海外保険",
                    checked:false
                }
            ]
        },

        {
            category:"🏃 アルティメット",

            items:[
                {
                    text:"ユニフォーム",
                    checked:false
                },

                {
                    text:"スパイク",
                    checked:false
                }
            ]
        }

    ];

}

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function updateProgress(){

    let total = 0;
    let done = 0;

    data.forEach(category=>{

        category.items.forEach(item=>{

            total++;

            if(item.checked){
                done++;
            }

        });

    });

    const percent =
        Math.round(done/total*100);

    document.getElementById(
        "progressText"
    ).innerText =
        `${done} / ${total} 完了 (${percent}%)`;

    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";
}

function deleteItem(
    categoryIndex,
    itemIndex
){

    data[categoryIndex]
        .items
        .splice(itemIndex,1);

    saveData();

    render();
}

function addItem(
    categoryIndex
){

    const input =
        document.getElementById(
            `input-${categoryIndex}`
        );

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    data[categoryIndex]
        .items
        .push({

            text:text,
            checked:false

        });

    saveData();

    render();
}

function render(){

    const list =
        document.getElementById(
            "listContainer"
        );

    list.innerHTML = "";

    data.forEach(
        (category,catIndex)=>{

        const section =
            document.createElement("div");

        section.className =
            "section";

        section.innerHTML = `

            <div class="section-title">
                ${category.category}
            </div>

            <div class="item-list"></div>

            <div class="add-area">

                <input
                    id="input-${catIndex}"
                    placeholder="項目追加">

                <button
                    onclick="addItem(${catIndex})">

                    ＋

                </button>

            </div>
        `;

        const itemList =
            section.querySelector(
                ".item-list"
            );

        category.items.forEach(
            (item,itemIndex)=>{

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                item.checked
                ? "item completed"
                : "item";

            row.innerHTML = `

                <label>

                    <input
                        type="checkbox"
                        ${item.checked ? "checked" : ""}>

                    ${item.text}

                </label>

                <button
                    class="delete-btn"
                    onclick="deleteItem(${catIndex},${itemIndex})">

                    削除

                </button>

            `;

            row.querySelector(
                "input"
            ).addEventListener(
                "change",
                e=>{

                item.checked =
                    e.target.checked;

                saveData();

                render();

            });

            itemList.appendChild(
                row
            );

        });

        list.appendChild(
            section
        );

    });

    updateProgress();
}

render();

</script>

</body>

</html>
