<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUCC 2026 Packing List</title>

    <link rel="stylesheet" href="packing.css">
</head>

<body>

    <div class="container">

        <header class="header">

            <h1>WUCC 2026 Packing List</h1>

            <p class="subtitle">
                アイルランド遠征用 持ち物チェックリスト
            </p>

            <div class="progress-area">

                <div id="progressText" class="progress-text">
                    0 / 0 完了
                </div>

                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>

            </div>

            <button id="addCategoryButton" class="add-category-btn">
                ＋ カテゴリ追加
            </button>

        </header>

        <main id="listContainer" class="sections">
        </main>

        <div class="bottom-area">

            <button id="resetButton" class="reset-btn">
                初期リストに戻す
            </button>

            <a href="index.html" class="home-link">
                ← Homeへ戻る
            </a>

        </div>

    </div>

    <script>

        const STORAGE_KEY = "packingData";

        const defaultData = [

            {
                category: "🛂 必須・機内持込",
                items: [
                    { text: "機内持込", type: "header" },
                    { text: "パスポート", checked: false, type: "item" },
                    { text: "海外保険", checked: false, type: "item" },
                    { text: "財布", checked: false, type: "item" },
                    { text: "現金", checked: false, type: "item" },
                    { text: "スマホ", checked: false, type: "item" },
                    { text: "モバイル充電器", checked: false, type: "item" },
                    { text: "家の鍵", checked: false, type: "item" },
                    { text: "常備薬", checked: false, type: "item" },
                    { text: "マスク", checked: false, type: "item" },
                    { text: "枕", checked: false, type: "item" },
                    { text: "メディキュット的なもの", checked: false, type: "item" },
                    { text: "汗拭きシート", checked: false, type: "item" },
                    { text: "長袖・長ズボン", checked: false, type: "item" },
                    { text: "コンタクト", checked: false, type: "item" },
                    { text: "目薬", checked: false, type: "item" }
                ]
            },

            {
                category: "🏃 試合で使う系",
                items: [
                    { text: "試合用品", type: "header" },
                    { text: "ユニフォーム", checked: false, type: "item" },
                    { text: "スパイク", checked: false, type: "item" },
                    { text: "ランシュー", checked: false, type: "item" },
                    { text: "帽子", checked: false, type: "item" },
                    { text: "グローブ", checked: false, type: "item" },
                    { text: "アンダー", checked: false, type: "item" },
                    { text: "サングラス", checked: false, type: "item" },
                    { text: "靴下", checked: false, type: "item" },
                    { text: "テーピング", checked: false, type: "item" },
                    { text: "氷嚢", checked: false, type: "item" },
                    { text: "ディスク", checked: false, type: "item" },
                    { text: "水筒", checked: false, type: "item" },
                    { text: "交換用ユニ", checked: false, type: "item" },
                    { text: "サポーター", checked: false, type: "item" },
                    { text: "レジャーシート", checked: false, type: "item" },
                    { text: "イス", checked: false, type: "item" },
                    { text: "カッパ", checked: false, type: "item" }
                ]
            },

            {
                category: "👕 生活用品系",
                items: [
                    { text: "生活用品", type: "header" },
                    { text: "シャンプー類", checked: false, type: "item" },
                    { text: "タオル", checked: false, type: "item" },
                    { text: "ボディタオル", checked: false, type: "item" },
                    { text: "クレンジング", checked: false, type: "item" },
                    { text: "スキンケア用品", checked: false, type: "item" },
                    { text: "歯ブラシセット", checked: false, type: "item" },
                    { text: "洗濯ネット", checked: false, type: "item" },
                    { text: "洗濯ロープ", checked: false, type: "item" },
                    { text: "洗濯ばさみ", checked: false, type: "item" },
                    { text: "ハンガー", checked: false, type: "item" },
                    { text: "洗濯洗剤", checked: false, type: "item" },
                    { text: "サンダル", checked: false, type: "item" },
                    { text: "折りたたみ傘", checked: false, type: "item" },
                    { text: "日焼け止め", checked: false, type: "item" },
                    { text: "ティッシュ", checked: false, type: "item" },
                    { text: "ゴミ袋大", checked: false, type: "item" },
                    { text: "ゴミ袋小", checked: false, type: "item" },
                    { text: "ジップロック", checked: false, type: "item" },
                    { text: "ばんそうこう", checked: false, type: "item" },
                    { text: "爪切り", checked: false, type: "item" },
                    { text: "新聞紙", checked: false, type: "item" },
                    { text: "生理用品", checked: false, type: "item" },
                    { text: "コンタクト保存液", checked: false, type: "item" }
                ]
            },

            {
                category: "🔌 電気系",
                items: [
                    { text: "充電・電源", type: "header" },
                    { text: "変換プラグ", checked: false, type: "item" },
                    { text: "変圧器", checked: false, type: "item" },
                    { text: "延長コード", checked: false, type: "item" },
                    { text: "ドライヤー", checked: false, type: "item" },
                    { text: "シェーバー", checked: false, type: "item" }
                ]
            },

            {
                category: "🍙 食品系",
                items: [
                    { text: "食品・補給", type: "header" },
                    { text: "部屋の米", checked: false, type: "item" },
                    { text: "アルファ米", checked: false, type: "item" },
                    { text: "ふりかけ", checked: false, type: "item" },
                    { text: "味噌汁", checked: false, type: "item" },
                    { text: "調味料", checked: false, type: "item" },
                    { text: "カロリーメイト", checked: false, type: "item" },
                    { text: "ウイダー", checked: false, type: "item" },
                    { text: "プロテイン", checked: false, type: "item" },
                    { text: "アミノ酸・サプリ", checked: false, type: "item" },
                    { text: "箸", checked: false, type: "item" },
                    { text: "スプーン・フォーク", checked: false, type: "item" },
                    { text: "紙コップ", checked: false, type: "item" },
                    { text: "タッパー", checked: false, type: "item" },
                    { text: "クーラーバッグ", checked: false, type: "item" },
                    { text: "保冷剤", checked: false, type: "item" },
                    { text: "サランラップ", checked: false, type: "item" },
                    { text: "パスタ", checked: false, type: "item" },
                    { text: "パスタ用タッパー", checked: false, type: "item" },
                    { text: "食器用洗剤・スポンジ", checked: false, type: "item" }
                ]
            }

        ];

        let data = loadData();

        function cloneDefaultData() {

            return JSON.parse(
                JSON.stringify(defaultData)
            );
        }

        function loadData() {

            const savedData =
                localStorage.getItem(STORAGE_KEY);

            if (!savedData) {
                return cloneDefaultData();
            }

            try {

                const parsedData =
                    JSON.parse(savedData);

                if (!Array.isArray(parsedData)) {
                    return cloneDefaultData();
                }

                migrateOldData(parsedData);

                return parsedData;

            } catch (error) {

                return cloneDefaultData();
            }
        }

        function migrateOldData(targetData) {

            targetData.forEach(category => {

                if (!Array.isArray(category.items)) {
                    category.items = [];
                }

                category.items.forEach(item => {

                    if (!item.type) {
                        item.type = "item";
                    }

                    if (item.type === "item" && typeof item.checked !== "boolean") {
                        item.checked = false;
                    }

                });

            });
        }

        function saveData() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );
        }

        function escapeHtml(text) {

            return String(text)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function formatText(text) {

            return escapeHtml(text)
                .replaceAll("\n", "<br>");
        }

        function isNormalItem(item) {

            return item.type !== "header";
        }

        function updateProgress() {

            let total = 0;
            let completed = 0;

            data.forEach(category => {

                category.items.forEach(item => {

                    if (!isNormalItem(item)) {
                        return;
                    }

                    total++;

                    if (item.checked) {
                        completed++;
                    }

                });

            });

            const percent =
                total === 0
                    ? 0
                    : Math.round((completed / total) * 100);

            document.getElementById("progressText").textContent =
                `${completed} / ${total} 完了 (${percent}%)`;

            document.getElementById("progressFill").style.width =
                `${percent}%`;
        }

        function getCategoryCompletedCount(category) {

            return category.items.filter(
                item => isNormalItem(item) && item.checked
            ).length;
        }

        function getCategoryNormalItemCount(category) {

            return category.items.filter(
                item => isNormalItem(item)
            ).length;
        }

        function renderList() {

            const listContainer =
                document.getElementById("listContainer");

            listContainer.innerHTML = "";

            data.forEach((category, categoryIndex) => {

                const section =
                    document.createElement("section");

                section.className = "section-card";

                section.innerHTML = `
                    <div class="section-header">

                        <div class="section-title-area">
                            <h2>${escapeHtml(category.category)}</h2>
                            <span class="section-count">
                                ${getCategoryCompletedCount(category)} / ${getCategoryNormalItemCount(category)}
                            </span>
                        </div>

                        <div class="category-actions">
                            <button
                                class="category-btn"
                                onclick="editCategory(${categoryIndex})">
                                編集
                            </button>

                            <button
                                class="category-delete-btn"
                                onclick="deleteCategory(${categoryIndex})">
                                削除
                            </button>
                        </div>

                    </div>

                    <div
                        class="item-list"
                        data-category-index="${categoryIndex}">
                    </div>

                    <div class="add-area">

                        <textarea
                            id="input-${categoryIndex}"
                            rows="3"
                            placeholder="このカテゴリに追加。改行も使えます。"></textarea>

                        <div class="add-buttons">

                            <button
                                class="add-btn"
                                onclick="addItem(${categoryIndex})">
                                アイテム追加
                            </button>

                            <button
                                class="add-header-btn"
                                onclick="addHeaderItem(${categoryIndex})">
                                見出し追加
                            </button>

                        </div>

                    </div>
                `;

                const itemList =
                    section.querySelector(".item-list");

                category.items.forEach((item, itemIndex) => {

                    const itemRow =
                        document.createElement("div");

                    if (item.type === "header") {

                        itemRow.className =
                            "item header-item-row";

                        itemRow.innerHTML = `
                            <div class="header-item-text">
                                ${formatText(item.text)}
                            </div>

                            <div class="item-actions">

                                <button
                                    class="move-btn"
                                    onclick="moveItemUp(${categoryIndex}, ${itemIndex})">
                                    ↑
                                </button>

                                <button
                                    class="move-btn"
                                    onclick="moveItemDown(${categoryIndex}, ${itemIndex})">
                                    ↓
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteItem(${categoryIndex}, ${itemIndex})">
                                    削除
                                </button>

                            </div>
                        `;

                    } else {

                        itemRow.className =
                            item.checked
                                ? "item completed"
                                : "item";

                        itemRow.innerHTML = `
                            <label class="item-label">
                                <input
                                    type="checkbox"
                                    ${item.checked ? "checked" : ""}>
                                <span class="item-text">
                                    ${formatText(item.text)}
                                </span>
                            </label>

                            <div class="item-actions">

                                <button
                                    class="move-btn"
                                    onclick="moveItemUp(${categoryIndex}, ${itemIndex})">
                                    ↑
                                </button>

                                <button
                                    class="move-btn"
                                    onclick="moveItemDown(${categoryIndex}, ${itemIndex})">
                                    ↓
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteItem(${categoryIndex}, ${itemIndex})">
                                    削除
                                </button>

                            </div>
                        `;

                        const checkbox =
                            itemRow.querySelector("input");

                        checkbox.addEventListener("change", event => {

                            item.checked =
                                event.target.checked;

                            saveData();
                            renderList();
                        });

                    }

                    itemList.appendChild(itemRow);

                });

                listContainer.appendChild(section);

            });

            updateProgress();
        }

        function addCategory() {

            const categoryName =
                prompt("新しいカテゴリ名を入力してください");

            if (!categoryName) {
                return;
            }

            const trimmedName =
                categoryName.trim();

            if (trimmedName === "") {
                return;
            }

            data.push({
                category: trimmedName,
                items: []
            });

            saveData();
            renderList();
        }

        function editCategory(categoryIndex) {

            const currentName =
                data[categoryIndex].category;

            const newName =
                prompt("カテゴリ名を編集してください", currentName);

            if (!newName) {
                return;
            }

            const trimmedName =
                newName.trim();

            if (trimmedName === "") {
                return;
            }

            data[categoryIndex].category =
                trimmedName;

            saveData();
            renderList();
        }

        function deleteCategory(categoryIndex) {

            const categoryName =
                data[categoryIndex].category;

            const result =
                confirm(`カテゴリ「${categoryName}」を削除しますか？\n中のアイテムも削除されます。`);

            if (!result) {
                return;
            }

            data.splice(categoryIndex, 1);

            saveData();
            renderList();
        }

        function getInputText(categoryIndex) {

            const input =
                document.getElementById(`input-${categoryIndex}`);

            return input.value.trim();
        }

        function clearInput(categoryIndex) {

            const input =
                document.getElementById(`input-${categoryIndex}`);

            input.value = "";
        }

        function addItem(categoryIndex) {

            const text =
                getInputText(categoryIndex);

            if (text === "") {
                return;
            }

            data[categoryIndex].items.push({
                text: text,
                checked: false,
                type: "item"
            });

            saveData();
            renderList();
        }

        function addHeaderItem(categoryIndex) {

            const text =
                getInputText(categoryIndex);

            if (text === "") {
                return;
            }

            data[categoryIndex].items.push({
                text: text,
                type: "header"
            });

            saveData();
            renderList();
        }

        function deleteItem(categoryIndex, itemIndex) {

            const itemName =
                data[categoryIndex].items[itemIndex].text;

            const result =
                confirm(`「${itemName}」を削除しますか？`);

            if (!result) {
                return;
            }

            data[categoryIndex].items.splice(itemIndex, 1);

            saveData();
            renderList();
        }

        function moveItem(categoryIndex, fromItemIndex, toItemIndex) {

            if (fromItemIndex === toItemIndex) {
                return;
            }

            const movedItem =
                data[categoryIndex].items.splice(fromItemIndex, 1)[0];

            data[categoryIndex].items.splice(
                toItemIndex,
                0,
                movedItem
            );

            saveData();
            renderList();
        }

        function moveItemUp(categoryIndex, itemIndex) {

            if (itemIndex === 0) {
                return;
            }

            moveItem(
                categoryIndex,
                itemIndex,
                itemIndex - 1
            );
        }

        function moveItemDown(categoryIndex, itemIndex) {

            const lastIndex =
                data[categoryIndex].items.length - 1;

            if (itemIndex >= lastIndex) {
                return;
            }

            moveItem(
                categoryIndex,
                itemIndex,
                itemIndex + 1
            );
        }

        function resetToDefault() {

            const result =
                confirm("チェック状態・追加項目・カテゴリ編集をすべてリセットして、初期リストに戻しますか？");

            if (!result) {
                return;
            }

            data = cloneDefaultData();

            saveData();
            renderList();
        }

        document
            .getElementById("addCategoryButton")
            .addEventListener("click", addCategory);

        document
            .getElementById("resetButton")
            .addEventListener("click", resetToDefault);

        renderList();

    </script>

</body>

</html>
