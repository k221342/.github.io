<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUCC 2026 Packing List</title>

    <link g.css

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/<div class="container">

        <div class="header">

            <h1>
                🇮🇪 WUCC 2026
            </h1>

            <h2>
                Packing List
            </h2>

            <p id="progressText">
                0 / 0 完了
            </p>

            <div class="progress-bar">
                <div id="progressFill"
                    class="progress-fill">
                </div>
            </div>

        </div>

        <div class="add-area">

            <input
                id="itemInput"
                type="text"
                placeholder="持ち物を追加">

            <button id="addButton">
                追加
            </button>

        </div>

        <div id="listContainer"></div>

        <a href="index.html" class="home-link">
            ← Homeへ戻る
        </a>

    </div>

    <script>

        const STORAGE_KEY = "wuccPackingList";

        const defaultItems = [

            {
                category: "🛂 必須アイテム",
                text: "パスポート",
                checked: false
            },

            {
                category: "🛂 必須アイテム",
                text: "海外保険",
                checked: false
            },

            {
                category: "🛂 必須アイテム",
                text: "財布",
                checked: false
            },

            {
                category: "🛂 必須アイテム",
                text: "現金",
                checked: false
            },

            {
                category: "🛂 必須アイテム",
                text: "スマホ",
                checked: false
            },

            {
                category: "🛂 必須アイテム",
                text: "家の鍵",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "ユニフォーム",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "スパイク",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "ランシュー",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "帽子",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "グローブ",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "サングラス",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "テーピング",
                checked: false
            },

            {
                category: "🏃 アルティメット",
                text: "ディスク",
                checked: false
            },

            {
                category: "🔌 電子機器",
                text: "モバイル充電器",
                checked: false
            },

            {
                category: "🔌 電子機器",
                text: "変換プラグ",
                checked: false
            },

            {
                category: "🔌 電子機器",
                text: "延長コード",
                checked: false
            },

            {
                category: "👕 衣類・生活用品",
                text: "着替え",
                checked: false
            },

            {
                category: "👕 衣類・生活用品",
                text: "タオル",
                checked: false
            },

            {
                category: "👕 衣類・生活用品",
                text: "歯ブラシセット",
                checked: false
            },

            {
                category: "👕 衣類・生活用品",
                text: "洗濯ネット",
                checked: false
            },

            {
                category: "👕 衣類・生活用品",
                text: "サンダル",
                checked: false
            },

            {
                category: "👕 衣類・生活用品",
                text: "日焼け止め",
                checked: false
            }

        ];

        let items =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            ) || defaultItems;

        function saveData() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(items)
            );
        }

        function updateProgress() {

            const total = items.length;

            const checked =
                items.filter(
                    item => item.checked
                ).length;

            document.getElementById(
                "progressText"
            ).innerText =
                `${checked} / ${total} 完了`;

            document.getElementById(
                "progressFill"
            ).style.width =
                `${checked / total * 100}%`;
        }

        function render() {

            const container =
                document.getElementById(
                    "listContainer"
                );

            container.innerHTML = "";

            const categories =
                [...new Set(
                    items.map(
                        item => item.category
                    )
                )];

            categories.forEach(category => {

                const section =
                    document.createElement("div");

                section.className =
                    "section";

                section.innerHTML =
                    `<div class="section-title">
                        ${category}
                     </div>`;

                items
                    .filter(
                        item =>
                        item.category === category
                    )
                    .forEach(item => {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "item";

                        if(item.checked){

                            div.classList.add(
                                "completed"
                            );
                        }

                        div.innerHTML =
                        `
                        <label>
                            <input
                                type="checkbox"
                                ${item.checked ? "checked" : ""}>
                            ${item.text}
                        </label>
                        `;

                        div.querySelector(
                            "input"
                        ).addEventListener(
                            "change",
                            e => {

                                item.checked =
                                    e.target.checked;

                                saveData();

                                render();
                            }
                        );

                        section.appendChild(
                            div
                        );
                    });

                container.appendChild(
                    section
                );

            });

            updateProgress();
        }

        document
            .getElementById(
                "addButton"
            )
            .addEventListener(
                "click",
                () => {

                    const text =
                        document
                        .getElementById(
                            "itemInput"
                        )
                        .value
                        .trim();

                    if(!text){
                        return;
                    }

                    items.push({

                        category:
                            "➕ 追加項目",

                        text:text,

                        checked:false
                    });

                    saveData();

                    render();

                    document
                    .getElementById(
                        "itemInput"
                    )
                    .value = "";
                }
            );

        render();

    </script>

</body>

</html>
